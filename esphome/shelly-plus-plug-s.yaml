# Shelly Plus Plug S as a Solarlife MPPT bridge.
#
# This is the secondary, example target of the repository: the plug keeps its
# relay, power metering and LED ring, and additionally talks to the MPPT over BLE.
# See README.md for the flashing route and its caveats.
#
# Replace the substitutions below, then:
#   esphome config shelly-plus-plug-s.yaml
#   esphome compile shelly-plus-plug-s.yaml

substitutions:
  device_name: shelly-plus-plug-s
  friendly_name: Shelly Plus Plug S
  channel_1: Relay
  # MPPT BLE address, kept in secrets.yaml.
  mppt_mac: !secret mppt_mac
  # Relay protection limits from the ESPHome device page.
  max_power: "1500"
  max_temp: "65.0"
  # Higher value gives lower watt readout; lower value gives lower voltage readout.
  current_res: "0.001"
  voltage_div: "1830"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # The MPPT bridge entities are grouped into their own Home Assistant device
  # instead of appearing under the Shelly. Requires ESPHome sub-device support.
  devices:
    - id: solarlife
      name: Solarlife
      relation: via
  on_boot:
    - delay: 10s
    - lambda: |-
        id(rgb_ready) = true;
    - script.execute: set_rgb

# Plus Plug S is a Gen2 device: classic ESP32, 4 MB flash. The partition table
# and bootloader offset are Shelly's, so ESPHome must be built to match.
esp32:
  variant: ESP32
  board: esp32dev
  flash_size: 4MB
  partitions: partitions/PlusPlugS-stock.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PARTITION_TABLE_OFFSET: "0x8000"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
    advanced:
      enable_ota_rollback: false

logger:
  # DEBUG logs every read frame (captured by esphome/tools/capture.py);
  # VERY_VERBOSE also logs every BLE notify chunk.
  level: VERY_VERBOSE

api:
  reboot_timeout: 0s

mqtt:
  discovery_unique_id_generator: mac
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discover_ip: False
  reboot_timeout: 0s

web_server:
  port: 80

ota:
  - platform: esphome
    allow_partition_access: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}

captive_portal:

time:
  - platform: homeassistant
    id: my_time

# The BLE hub and the entities it feeds. The entities are generated from the
# shared register table in ../registers.toml, see tools/gen_registers.py.
packages:
  solarlife_mppt: !include packages/solarlife_mppt.yaml

external_components:
  - source:
      type: local
      path: components
    components: [solarlife_mppt]

esp32_ble_tracker:

ble_client:
  - mac_address: ${mppt_mac}
    id: mppt_ble

solarlife_mppt:
  id: mppt
  ble_client_id: mppt_ble
  update_interval: 20s

# --- Relay, power metering, temperature and protection -----------------------

globals:
  - id: rgb_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: total_energy
    type: float
    restore_value: true
    initial_value: "0.0"

script:
  - id: set_rgb
    mode: queued
    then:
      - if:
          condition:
            lambda: "return id(rgb_ready);"
          then:
            - if:
                condition:
                  lambda: "return id(relay).state;"
                then:
                  - if:
                      condition:
                        lambda: "return id(ring_on).remote_values.is_on();"
                      then:
                        - light.turn_on:
                            id: rgb_light1
                            brightness: !lambda |-
                              return id(ring_on).remote_values.get_brightness();
                            red: !lambda |-
                              return id(ring_on).remote_values.get_red();
                            green: !lambda |-
                              return id(ring_on).remote_values.get_green();
                            blue: !lambda |-
                              return id(ring_on).remote_values.get_blue();
                        - light.turn_on:
                            id: rgb_light2
                            brightness: !lambda |-
                              return id(ring_on).remote_values.get_brightness();
                            red: !lambda |-
                              return id(ring_on).remote_values.get_red();
                            green: !lambda |-
                              return id(ring_on).remote_values.get_green();
                            blue: !lambda |-
                              return id(ring_on).remote_values.get_blue();
                      else:
                        - light.turn_off: rgb_light1
                        - light.turn_off: rgb_light2
                else:
                  - if:
                      condition:
                        lambda: "return id(ring_off).remote_values.is_on();"
                      then:
                        - light.turn_on:
                            id: rgb_light1
                            brightness: !lambda |-
                              return id(ring_off).remote_values.get_brightness();
                            red: !lambda |-
                              return id(ring_off).remote_values.get_red();
                            green: !lambda |-
                              return id(ring_off).remote_values.get_green();
                            blue: !lambda |-
                              return id(ring_off).remote_values.get_blue();
                        - light.turn_on:
                            id: rgb_light2
                            brightness: !lambda |-
                              return id(ring_off).remote_values.get_brightness();
                            red: !lambda |-
                              return id(ring_off).remote_values.get_red();
                            green: !lambda |-
                              return id(ring_off).remote_values.get_green();
                            blue: !lambda |-
                              return id(ring_off).remote_values.get_blue();
                      else:
                        - light.turn_off: rgb_light1
                        - light.turn_off: rgb_light2

# The two RGB "lights" below are colour holders only: their outputs do not drive
# hardware, they just refresh the ring when the configured colour changes.
output:
  - platform: template
    id: r_out_on
    type: float
    write_action:
      - script.execute: set_rgb
  - platform: template
    id: g_out_on
    type: float
    write_action:
      - script.execute: set_rgb
  - platform: template
    id: b_out_on
    type: float
    write_action:
      - script.execute: set_rgb
  - platform: template
    id: r_out_off
    type: float
    write_action:
      - script.execute: set_rgb
  - platform: template
    id: g_out_off
    type: float
    write_action:
      - script.execute: set_rgb
  - platform: template
    id: b_out_off
    type: float
    write_action:
      - script.execute: set_rgb

light:
  - platform: rgb
    id: ring_on
    name: "${channel_1} Ring when On"
    icon: mdi:circle-outline
    default_transition_length: 0s
    red: r_out_on
    green: g_out_on
    blue: b_out_on
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_state:
      - delay: 50ms
      - script.execute: set_rgb
  - platform: rgb
    id: ring_off
    name: "${channel_1} Ring when Off"
    icon: mdi:circle-outline
    default_transition_length: 0s
    red: r_out_off
    green: g_out_off
    blue: b_out_off
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_state:
      - delay: 50ms
      - script.execute: set_rgb
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: ws2812
    pin: GPIO25
    num_leds: 2
    id: rgb_light1
    internal: true
    default_transition_length: 700ms
    restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: ws2812
    pin: GPIO26
    num_leds: 2
    id: rgb_light2
    internal: true
    default_transition_length: 700ms
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: push_button
    internal: true
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 5ms
    on_click:
      then:
        - if:
            condition:
              switch.is_off: button_lock
            then:
              - switch.toggle: relay

switch:
  - platform: gpio
    pin: GPIO4
    id: relay
    name: "${channel_1}"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: set_rgb
    on_turn_off:
      - script.execute: set_rgb
  - platform: template
    entity_category: config
    name: "Button lock"
    id: button_lock
    optimistic: true
    restore_mode: ALWAYS_OFF

sensor:
  - platform: ntc
    sensor: temp_resistance_reading
    name: "${device_name} Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: mdi:thermometer
    entity_category: diagnostic
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - switch.turn_off: relay
          - homeassistant.service:
              service: persistent_notification.create
              data:
                title: Message from ${device_name}
                message: Switch turned off because temperature exceeded ${max_temp} °C
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO33
    attenuation: 12db
    update_interval: 10s

  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: GPIO19
      inverted: true
    cf_pin: GPIO10
    cf1_pin: GPIO22
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    change_mode_every: 1
    update_interval: 5s
    current:
      id: current
      unit_of_measurement: A
      accuracy_decimals: 3
      internal: true
      name: "${channel_1} current"
    voltage:
      id: voltage
      unit_of_measurement: V
      accuracy_decimals: 1
      name: "${channel_1} voltage"
    power:
      id: power
      name: "${channel_1} power"
      unit_of_measurement: W
      icon: mdi:flash-outline
      force_update: true
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: relay
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: Message from ${device_name}
                  message: Switch turned off because power exceeded ${max_power} W

  - platform: total_daily_energy
    name: "${channel_1} energy"
    power_id: power
    state_class: total_increasing
    unit_of_measurement: kWh
    filters:
      # Multiplication factor from W to kW is 0.001.
      - multiply: 0.001
      - lambda: |-
          static auto last_state = x;
          if (x < last_state) {
            // x was reset
            id(total_energy) += last_state;
            ESP_LOGI("main", "Energy channel 1 was reset: %f", id(total_energy));
          }
          last_state = x;
          return id(total_energy) + x;
